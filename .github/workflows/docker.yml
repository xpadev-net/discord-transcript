name: Docker

on:
  push:
    branches:
      - master
  release:
    types:
      - published

permissions:
  contents: read
  packages: write

concurrency:
  group: docker-${{ github.ref }}
  cancel-in-progress: true

env:
  IMAGE_NAME: ghcr.io/xpadev-net/discord-transcript

jobs:
  preflight:
    name: Publish policy
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      release_tag: ${{ steps.policy.outputs.release_tag }}
      should_publish: ${{ steps.policy.outputs.should_publish }}
      source_sha: ${{ steps.policy.outputs.source_sha }}

    steps:
      - name: Checkout
        uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4.3.1
        with:
          fetch-depth: 0
          fetch-tags: true

      - name: Validate Dockerfile policy
        run: python3 tests/dockerfile_policy.py

      - name: Validate publish policy
        id: policy
        shell: bash
        env:
          DEFAULT_BRANCH: ${{ github.event.repository.default_branch }}
          EVENT_NAME: ${{ github.event_name }}
          EVENT_SHA: ${{ github.sha }}
          REF: ${{ github.ref }}
          RELEASE_TAG: ${{ github.event.release.tag_name }}
        run: |
          set -euo pipefail

          should_publish=false
          release_tag=""
          source_sha=""

          if [[ "$EVENT_NAME" == "push" ]]; then
            if [[ "$REF" != "refs/heads/$DEFAULT_BRANCH" ]]; then
              echo "::error::Docker snapshot publishing is limited to the default branch."
              exit 1
            fi
            should_publish=true
            source_sha="$EVENT_SHA"
          elif [[ "$EVENT_NAME" == "release" ]]; then
            if [[ ! "$RELEASE_TAG" =~ ^v[0-9]+\.[0-9]+\.[0-9]+(-[0-9A-Za-z][0-9A-Za-z.-]*)?$ ]]; then
              echo "::error::Release tag must be vMAJOR.MINOR.PATCH with an optional prerelease suffix."
              exit 1
            fi

            git fetch --force --tags origin "$DEFAULT_BRANCH"
            if [[ "$(git cat-file -t "refs/tags/$RELEASE_TAG")" != "tag" ]]; then
              echo "::error::Release tag $RELEASE_TAG must be an annotated tag."
              exit 1
            fi

            tag_commit="$(git rev-list -n 1 "refs/tags/$RELEASE_TAG")"
            event_commit="$(git rev-parse "$EVENT_SHA^{commit}")"
            if [[ "$tag_commit" != "$event_commit" ]]; then
              echo "::error::Release event SHA does not match tag $RELEASE_TAG."
              exit 1
            fi

            if ! git merge-base --is-ancestor "$tag_commit" "origin/$DEFAULT_BRANCH"; then
              echo "::error::Release tag $RELEASE_TAG must point to a commit reachable from $DEFAULT_BRANCH."
              exit 1
            fi

            should_publish=true
            release_tag="$RELEASE_TAG"
            source_sha="$tag_commit"
          else
            echo "::error::Unsupported event $EVENT_NAME."
            exit 1
          fi

          echo "release_tag=$release_tag" >> "$GITHUB_OUTPUT"
          echo "should_publish=$should_publish" >> "$GITHUB_OUTPUT"
          echo "source_sha=$source_sha" >> "$GITHUB_OUTPUT"

  build:
    needs: preflight
    if: needs.preflight.outputs.should_publish == 'true'
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 30
    environment:
      name: ${{ github.event_name == 'release' && 'ghcr-release' || 'ghcr-snapshot' }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: linux/amd64
            runner: ubuntu-latest
          - platform: linux/arm64
            runner: ubuntu-24.04-arm

    steps:
      - name: Checkout
        uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4.3.1
        with:
          ref: ${{ needs.preflight.outputs.source_sha }}

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@8d2750c68a42422c14e847fe6c8ac0403b4cbd6f # v3.12.0

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@c94ce9fb468520275223c153574b00df6fe4bcc9 # v3.7.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Extract metadata
        id: meta
        uses: docker/metadata-action@c299e40c65443455700f0fdfc63efafe5b349051 # v5.10.0
        with:
          images: ${{ env.IMAGE_NAME }}

      - name: Build and push by digest
        id: build
        uses: docker/build-push-action@10e90e3645eae34f1e60eeb005ba3a3d33f178e8 # v6.19.2
        with:
          context: .
          platforms: ${{ matrix.platform }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha,scope=${{ matrix.platform }}
          cache-to: type=gha,scope=${{ matrix.platform }},mode=max
          provenance: mode=max
          sbom: true
          outputs: type=image,name=${{ env.IMAGE_NAME }},push-by-digest=true,name-canonical=true,push=true

      - name: Export digest
        run: |
          mkdir -p /tmp/digests
          digest="${{ steps.build.outputs.digest }}"
          touch "/tmp/digests/${digest#sha256:}"

      - name: Upload digest
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: digest-${{ matrix.platform == 'linux/amd64' && 'amd64' || 'arm64' }}
          path: /tmp/digests/*
          if-no-files-found: error
          retention-days: 1

  merge:
    needs:
      - preflight
      - build
    if: needs.preflight.outputs.should_publish == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    environment:
      name: ${{ github.event_name == 'release' && 'ghcr-release' || 'ghcr-snapshot' }}

    steps:
      - name: Download digests
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with:
          path: /tmp/digests
          pattern: digest-*
          merge-multiple: true

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@8d2750c68a42422c14e847fe6c8ac0403b4cbd6f # v3.12.0

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@c94ce9fb468520275223c153574b00df6fe4bcc9 # v3.7.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Extract metadata
        id: meta
        uses: docker/metadata-action@c299e40c65443455700f0fdfc63efafe5b349051 # v5.10.0
        with:
          images: ${{ env.IMAGE_NAME }}
          flavor: |
            latest=false
          tags: |
            type=raw,value=latest,enable=${{ github.event_name == 'push' && github.ref == format('refs/heads/{0}', github.event.repository.default_branch) }}
            type=sha,prefix=,enable=${{ github.event_name == 'push' }}
            type=raw,value={{date 'YYYYMMDD'}}-{{sha}},enable=${{ github.event_name == 'push' }}
            type=semver,pattern=v{{version}},value=${{ needs.preflight.outputs.release_tag }},enable=${{ github.event_name == 'release' }}

      - name: Create manifest list and push
        working-directory: /tmp/digests
        run: |
          tag_args=()
          while IFS= read -r tag; do
            tag_args+=("-t" "$tag")
          done < <(jq -cr '.tags[]' <<< "$DOCKER_METADATA_OUTPUT_JSON")

          sources=()
          for digest in *; do
            sources+=("${IMAGE_NAME}@sha256:${digest}")
          done

          docker buildx imagetools create \
            "${tag_args[@]}" \
            "${sources[@]}"

      - name: Inspect image
        run: |
          tag=$(jq -cr '.tags[0]' <<< "$DOCKER_METADATA_OUTPUT_JSON")
          docker buildx imagetools inspect "$tag"
