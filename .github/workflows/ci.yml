name: CI

on:
  push:
    branches:
      - "**"
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  workflow-policy:
    name: workflow policy
    runs-on: ubuntu-latest
    timeout-minutes: 5

    steps:
      - name: Checkout
        uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4.3.1

      - name: Validate workflow action pinning policy
        run: python3 tests/workflow_action_policy.py

      - name: Validate Dockerfile policy
        run: python3 tests/dockerfile_policy.py

  docker-image:
    name: docker image build
    needs: workflow-policy
    runs-on: ubuntu-latest
    timeout-minutes: 45

    steps:
      - name: Checkout
        uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4.3.1

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@8d2750c68a42422c14e847fe6c8ac0403b4cbd6f # v3.12.0

      - name: Build Docker builder target
        run: docker buildx build --progress=plain --target builder .

      - name: Build Docker production image
        run: docker buildx build --progress=plain --target production --tag discord-transcript:ci --load .

  frontend:
    name: frontend checks
    needs: workflow-policy
    runs-on: ubuntu-latest
    timeout-minutes: 10
    defaults:
      run:
        working-directory: web
    steps:
      - name: Checkout
        uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4.3.1

      - name: Install pnpm
        uses: pnpm/action-setup@b906affcce14559ad1aafd4ab0e942779e9f58b1 # v4.3.0
        with:
          version: 10

      - name: Setup Node.js
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: 24
          cache: pnpm
          cache-dependency-path: web/pnpm-lock.yaml

      - run: pnpm install --frozen-lockfile
      - run: pnpm run lint
      - run: pnpm exec tsc --noEmit
      - run: pnpm run test
      - run: pnpm run build

  rust:
    name: rust checks
    needs: workflow-policy
    runs-on: ubuntu-latest
    timeout-minutes: 60
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: discord_transcript_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d discord_transcript_test"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    steps:
      - name: Checkout
        uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4.3.1

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@67ef31d5b988238dd797d409d6f9574278e20537 # master
        with:
          toolchain: stable
          components: rustfmt, clippy

      - name: Cache cargo registry and build artifacts
        uses: Swatinem/rust-cache@e18b497796c12c097a38f9edb9d0641fb99eee32 # v2

      - name: Validate Cargo lockfile policy
        run: python3 tests/cargo_lock_policy.py

      - name: cargo metadata (locked)
        run: cargo metadata --locked --all-features --format-version 1 > /dev/null

      - name: cargo fmt (check)
        run: cargo fmt --all -- --check

      - name: cargo test Postgres SQL contract smoke
        env:
          DISCORD_TRANSCRIPT_TEST_DATABASE_URL: postgres://postgres:postgres@localhost:5432/discord_transcript_test
        run: cargo test --locked --test postgres_sql_contract_smoke -- --nocapture

      - name: cargo clippy (deny warnings)
        run: cargo clippy --locked --workspace --all-targets --all-features -- -D warnings

      - name: cargo test
        run: cargo test --locked --workspace --all-targets --all-features
