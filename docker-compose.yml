services:
  app:
    # Use an immutable release tag or digest for production. The mutable
    # "latest" tag is only suitable for local smoke tests.
    image: ${DISCORD_TRANSCRIPT_IMAGE:?Set DISCORD_TRANSCRIPT_IMAGE to ghcr.io/xpadev-net/discord-transcript:<release-tag> or ghcr.io/xpadev-net/discord-transcript@sha256:<digest>}
    # Host networking is required only for the Discord voice runtime (songbird).
    # Docker's bridge network does not reliably NAT the UDP traffic
    # needed for voice gateway IP discovery and audio streaming.
    network_mode: host
    depends_on:
      db:
        condition: service_healthy
      migrate:
        condition: service_completed_successfully
    env_file: .env
    environment:
      DATABASE_URL: postgresql://discord_transcript:${POSTGRES_PASSWORD}@127.0.0.1/discord_transcript
      # Default: Claude CLI. Use SUMMARY_HARNESS / SUMMARY_COMMAND / SUMMARY_MODEL for Cursor or OpenCode.
      CLAUDE_COMMAND: claude
      CLAUDE_MODEL: ${CLAUDE_MODEL:-haiku}
      CHUNK_STORAGE_DIR: /data/chunks
      AUTO_STOP_GRACE_SECONDS: ${AUTO_STOP_GRACE_SECONDS:-60}
      WHISPER_LANGUAGE: ${WHISPER_LANGUAGE:-ja}
      PUBLIC_BASE_URL: ${PUBLIC_BASE_URL:-}
      WEB_PORT: ${WEB_PORT:-3000}
      # Keep the web UI loopback-only by default because app uses host networking.
      WEB_BIND_HOST: ${WEB_BIND_HOST:-127.0.0.1}
      DISCORD_CLIENT_ID: ${DISCORD_CLIENT_ID:-}
      DISCORD_CLIENT_SECRET: ${DISCORD_CLIENT_SECRET:-}
      WEB_SESSION_SECRET: ${WEB_SESSION_SECRET:-}
    volumes:
      - chunks:/data/chunks
    healthcheck:
      test: ["CMD-SHELL", "curl -fsS http://127.0.0.1:${WEB_PORT:-3000}/healthz >/dev/null"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 15s
    restart: unless-stopped

  db:
    image: postgres:16
    environment:
      POSTGRES_DB: discord_transcript
      POSTGRES_USER: discord_transcript
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
    ports:
      - "127.0.0.1:5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U discord_transcript"]
      interval: 5s
      timeout: 5s
      retries: 5
    restart: unless-stopped

  migrate:
    image: ${DISCORD_TRANSCRIPT_IMAGE:?Set DISCORD_TRANSCRIPT_IMAGE to ghcr.io/xpadev-net/discord-transcript:<release-tag> or ghcr.io/xpadev-net/discord-transcript@sha256:<digest>}
    depends_on:
      db:
        condition: service_healthy
    environment:
      DATABASE_URL: postgresql://discord_transcript:${POSTGRES_PASSWORD}@db:5432/discord_transcript
      DATABASE_SSL_MODE: ${DATABASE_SSL_MODE:-disable}
    command: ["discord-transcript", "migrate"]

volumes:
  pgdata:
  chunks:
